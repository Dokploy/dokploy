packages:
  - "apps/api"
  - "apps/dokploy"
  - "apps/schedules"
  - "packages/server"

# Supply-chain hardening: refuse package versions younger than N days,
# so newly-published malicious versions get caught/yanked before we install them.
# Disabled for now — kept breaking builds on unrelated fresh transitive deps
# (see PR #4679). Re-enable when there's a per-scope threshold or exclude list.
# minimumReleaseAge: 1440

# pnpm v10+ settings that previously lived under the "pnpm" key in package.json.
# Note: keep ALL overrides here. If any are declared via package.json "resolutions"
# or the old "pnpm" key, pnpm 10 silently drops the workspace ones.
overrides:
  "esbuild": "0.20.2"
  "better-call": "1.3.7"
  "@better-fetch/fetch": "1.3.1"
  "@types/react": "18.3.5"
  "@types/react-dom": "18.3.0"

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "prisma"
  - "@scarf/scarf"
  - "@tree-sitter-grammars/tree-sitter-yaml"
  - "bcrypt"
  - "better-sqlite3"
  - "core-js-pure"
  - "cpu-features"
  - "esbuild"
  - "msgpackr-extract"
  - "node-pty"
  - "protobufjs"
  - "sharp"
  - "ssh2"
  - "tree-sitter"
  - "tree-sitter-json"

peerDependencyRules:
  ignoreMissing:
    - "prisma"
    - "@prisma/client"
    - "@prisma/engines"
    - "@electric-sql/pglite"
    - "typescript"
    - "drizzle-kit"



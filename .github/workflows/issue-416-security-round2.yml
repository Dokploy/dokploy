name: Issue 416 Security Round 2

on:
  push:
    branches:
      - feat/issue-416-backup-destinations
    paths:
      - .github/workflows/issue-416-security-round2.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/issue-416-backup-destinations
      - uses: pnpm/action-setup@v5
        with:
          version: 10.22.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.4.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply guarded security fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          # 1) Central safe rclone error-message helper.
          redact = Path('packages/server/src/utils/backups/redact.ts')
          text = redact.read_text()
          if 'getSafeRcloneErrorMessage' not in text:
              text += '''\n\nexport const getSafeRcloneErrorMessage = (error: unknown): string =>\n\tredactRcloneCredentials(\n\t\terror instanceof Error ? error.message : String(error),\n\t);\n'''
          redact.write_text(text)

          # 2) Sanitize database/compose backup notification, console and rethrow paths.
          files = [
              'packages/server/src/utils/backups/postgres.ts',
              'packages/server/src/utils/backups/mysql.ts',
              'packages/server/src/utils/backups/mariadb.ts',
              'packages/server/src/utils/backups/mongo.ts',
              'packages/server/src/utils/backups/libsql.ts',
              'packages/server/src/utils/backups/compose.ts',
          ]
          for name in files:
              p = Path(name)
              text = p.read_text()
              if 'getSafeRcloneErrorMessage' not in text:
                  text = replace_once(
                      text,
                      'import {\n\tgetBackupCommand,',
                      'import { getSafeRcloneErrorMessage } from "./redact";\nimport {\n\tgetBackupCommand,',
                      f'{name} import',
                  )
              catch = '\t} catch (error) {\n'
              if text.count(catch) != 1:
                  raise SystemExit(f'{name}: expected exactly one catch, found {text.count(catch)}')
              if 'const safeErrorMessage = getSafeRcloneErrorMessage(error);' not in text:
                  text = text.replace(catch, catch + '\t\tconst safeErrorMessage = getSafeRcloneErrorMessage(error);\n', 1)
              text = text.replace(
                  '\t\tconsole.log(error);\n',
                  '\t\tconsole.error("Backup error:", safeErrorMessage);\n',
                  1,
              )
              text = replace_once(
                  text,
                  '\t\t\t// @ts-ignore\n\t\t\terrorMessage: error?.message || "Error message not provided",',
                  '\t\t\terrorMessage: safeErrorMessage,',
                  f'{name} notification',
              )
              text = replace_once(
                  text,
                  '\t\tthrow error;\n',
                  '\t\tthrow new Error(safeErrorMessage);\n',
                  f'{name} rethrow',
              )
              p.write_text(text)

          web = Path('packages/server/src/utils/backups/web-server.ts')
          text = web.read_text()
          text = replace_once(
              text,
              'import { redactRcloneCredentials } from "./redact";',
              'import { getSafeRcloneErrorMessage, redactRcloneCredentials } from "./redact";',
              'web-server import',
          )
          text = replace_once(
              text,
              '''\t\tconst safeErrorMessage = redactRcloneCredentials(\n\t\t\terror instanceof Error ? error.message : String(error),\n\t\t);''',
              '\t\tconst safeErrorMessage = getSafeRcloneErrorMessage(error);',
              'web-server safe error',
          )
          text = replace_once(
              text,
              '\t\tthrow error;\n',
              '\t\tthrow new Error(safeErrorMessage);\n',
              'web-server rethrow',
          )
          web.write_text(text)

          # 3) Prevent FTPS certificate-verification bypasses.
          validation = Path('packages/server/src/db/validations/destination.ts')
          text = validation.read_text()
          text = replace_once(
              text,
              'export const FTP_TLS_CONFLICT_ERROR =\n\t"Choose either implicit FTPS or explicit FTPS, not both.";\n',
              'export const FTP_TLS_CONFLICT_ERROR =\n\t"Choose either implicit FTPS or explicit FTPS, not both.";\nexport const FTP_CERTIFICATE_VERIFICATION_REQUIRED_ERROR =\n\t"FTP TLS certificate verification cannot be disabled.";\n',
              'FTP certificate error constant',
          )
          anchor = '''export const getFtpTlsState = (flags: readonly string[] | null | undefined) => {\n\tconst values = flags ?? [];\n\treturn {\n\t\timplicitTlsEnabled: isBooleanFlagEnabled(values, "--ftp-tls"),\n\t\texplicitTlsEnabled: isBooleanFlagEnabled(values, "--ftp-explicit-tls"),\n\t};\n};\n'''
          helper = anchor + '''\nexport const hasDisabledFtpCertificateVerification = (\n\tflags: readonly string[] | null | undefined,\n): boolean => {\n\tconst values = flags ?? [];\n\treturn ["--ftp-no-check-certificate", "--no-check-certificate"].some(\n\t\t(flag) => values.includes(flag) || values.includes(`${flag}=true`),\n\t);\n};\n'''
          text = replace_once(text, anchor, helper, 'FTP insecure certificate helper')
          validation.write_text(text)

          schema = Path('packages/server/src/db/schema/destination.ts')
          text = schema.read_text()
          text = replace_once(
              text,
              '\tFTP_TLS_CONFLICT_ERROR,\n\tFTP_TLS_REQUIRED_ERROR,\n\tgetFtpTlsState,',
              '\tFTP_CERTIFICATE_VERIFICATION_REQUIRED_ERROR,\n\tFTP_TLS_CONFLICT_ERROR,\n\tFTP_TLS_REQUIRED_ERROR,\n\tgetFtpTlsState,\n\thasDisabledFtpCertificateVerification,',
              'schema FTP security imports',
          )
          insert_after = '''\t\tif (implicitTlsEnabled && explicitTlsEnabled) {\n\t\t\tctx.addIssue({\n\t\t\t\tcode: "custom",\n\t\t\t\tpath: ["additionalFlags"],\n\t\t\t\tmessage: FTP_TLS_CONFLICT_ERROR,\n\t\t\t});\n\t\t}\n'''
          schema_guard = insert_after + '''\t\tif (hasDisabledFtpCertificateVerification(data.additionalFlags)) {\n\t\t\tctx.addIssue({\n\t\t\t\tcode: "custom",\n\t\t\t\tpath: ["additionalFlags"],\n\t\t\t\tmessage: FTP_CERTIFICATE_VERIFICATION_REQUIRED_ERROR,\n\t\t\t});\n\t\t}\n'''
          text = replace_once(text, insert_after, schema_guard, 'schema FTP certificate guard')
          schema.write_text(text)

          utils = Path('packages/server/src/utils/backups/utils.ts')
          text = utils.read_text()
          text = replace_once(
              text,
              '\tFTP_TLS_CONFLICT_ERROR,\n\tFTP_TLS_REQUIRED_ERROR,\n\tgetFtpTlsState,',
              '\tFTP_CERTIFICATE_VERIFICATION_REQUIRED_ERROR,\n\tFTP_TLS_CONFLICT_ERROR,\n\tFTP_TLS_REQUIRED_ERROR,\n\tgetFtpTlsState,\n\thasDisabledFtpCertificateVerification,',
              'runtime FTP security imports',
          )
          runtime_anchor = '''\t\t\tif (implicitTlsEnabled && explicitTlsEnabled) {\n\t\t\t\tthrow new Error(FTP_TLS_CONFLICT_ERROR);\n\t\t\t}\n'''
          runtime_guard = runtime_anchor + '''\t\t\tif (hasDisabledFtpCertificateVerification(additionalFlags)) {\n\t\t\t\tthrow new Error(FTP_CERTIFICATE_VERIFICATION_REQUIRED_ERROR);\n\t\t\t}\n'''
          text = replace_once(text, runtime_anchor, runtime_guard, 'runtime FTP certificate guard')
          utils.write_text(text)

          # 4) Regression tests: propagated secrets and FTPS certificate bypasses.
          redaction_test = Path('apps/dokploy/__test__/backups/redact-credentials.test.ts')
          text = redaction_test.read_text()
          text = replace_once(
              text,
              'import { redactRcloneCredentials } from "@dokploy/server/utils/backups/redact";',
              'import {\n\tgetSafeRcloneErrorMessage,\n\tredactRcloneCredentials,\n} from "@dokploy/server/utils/backups/redact";',
              'redaction test import',
          )
          new_test = '''\n\tit("should sanitize rclone credentials from propagated backup errors", () => {\n\t\tconst error = new Error(\n\t\t\t"Command failed: rclone rcat --s3-access-key-id=ACCESS_VALUE_9X --s3-secret-access-key=S3_VALUE_LEAK_9X --ftp-pass=FTP_VALUE_LEAK_9X --sftp-pass=SFTP_VALUE_LEAK_9X --sftp-key-file-pass=KEY_VALUE_LEAK_9X :ftp:backups/file.gz",\n\t\t);\n\t\tconst safe = getSafeRcloneErrorMessage(error);\n\n\t\tfor (const secret of [\n\t\t\t"ACCESS_VALUE_9X",\n\t\t\t"S3_VALUE_LEAK_9X",\n\t\t\t"FTP_VALUE_LEAK_9X",\n\t\t\t"SFTP_VALUE_LEAK_9X",\n\t\t\t"KEY_VALUE_LEAK_9X",\n\t\t]) {\n\t\t\texpect(safe).not.toContain(secret);\n\t\t}\n\t\texpect(safe.match(/\\[REDACTED\\]/g)?.length).toBe(5);\n\t});\n'''
          idx = text.rfind('\n});')
          if idx == -1:
              raise SystemExit('redaction test insertion point missing')
          text = text[:idx] + new_test + text[idx:]
          redaction_test.write_text(text)

          backup_test = Path('apps/dokploy/__test__/utils/backups.test.ts')
          text = backup_test.read_text()
          extra = '''\n\ndescribe("FTP TLS certificate verification", () => {\n\tconst input = {\n\t\tname: "FTP backups",\n\t\tprovider: RCLONE_DESTINATION_PROVIDERS.FTP,\n\t\taccessKey: "backup-user",\n\t\tsecretAccessKey: "secret",\n\t\tbucket: "backups",\n\t\tregion: "",\n\t\tendpoint: "storage.example.com",\n\t};\n\n\ttest.each(["--ftp-no-check-certificate", "--no-check-certificate"])(\n\t\t"rejects certificate-verification bypass %s at schema validation",\n\t\t(flag) => {\n\t\t\texpect(\n\t\t\t\tapiCreateDestination.safeParse({\n\t\t\t\t\t...input,\n\t\t\t\t\tadditionalFlags: ["--ftp-explicit-tls", flag],\n\t\t\t\t}).success,\n\t\t\t).toBe(false);\n\t\t},\n\t);\n\n\ttest.each(["--ftp-no-check-certificate", "--no-check-certificate"])(\n\t\t"rejects certificate-verification bypass %s at runtime",\n\t\tasync (flag) => {\n\t\t\tawait expect(\n\t\t\t\tgetRclonePathAndFlags(\n\t\t\t\t\tdestination({\n\t\t\t\t\t\tprovider: RCLONE_DESTINATION_PROVIDERS.FTP,\n\t\t\t\t\t\tendpoint: "storage.example.com",\n\t\t\t\t\t\taccessKey: "backup-user",\n\t\t\t\t\t\tsecretAccessKey: "",\n\t\t\t\t\t\tregion: "",\n\t\t\t\t\t\tbucket: "backups",\n\t\t\t\t\t\tadditionalFlags: ["--ftp-explicit-tls", flag],\n\t\t\t\t\t}),\n\t\t\t\t),\n\t\t\t).rejects.toThrow("FTP TLS certificate verification cannot be disabled");\n\t\t},\n\t);\n\n\ttest.each([\n\t\t"--ftp-no-check-certificate=false",\n\t\t"--no-check-certificate=false",\n\t])("allows explicitly safe certificate flag %s", (flag) => {\n\t\texpect(\n\t\t\tapiCreateDestination.safeParse({\n\t\t\t\t...input,\n\t\t\t\tadditionalFlags: ["--ftp-explicit-tls", flag],\n\t\t\t}).success,\n\t\t).toBe(true);\n\t});\n});\n'''
          if 'describe("FTP TLS certificate verification"' not in text:
              text += extra
          backup_test.write_text(text)
          PY
      - name: Format changed files
        run: |
          pnpm exec biome check --write \
            packages/server/src/db/validations/destination.ts \
            packages/server/src/db/schema/destination.ts \
            packages/server/src/utils/backups/utils.ts \
            packages/server/src/utils/backups/redact.ts \
            packages/server/src/utils/backups/postgres.ts \
            packages/server/src/utils/backups/mysql.ts \
            packages/server/src/utils/backups/mariadb.ts \
            packages/server/src/utils/backups/mongo.ts \
            packages/server/src/utils/backups/libsql.ts \
            packages/server/src/utils/backups/compose.ts \
            packages/server/src/utils/backups/web-server.ts \
            apps/dokploy/__test__/backups/redact-credentials.test.ts \
            apps/dokploy/__test__/utils/backups.test.ts
      - name: Focused security regression tests
        run: pnpm --filter=dokploy exec vitest --config __test__/vitest.config.ts __test__/backups/redact-credentials.test.ts __test__/utils/backups.test.ts __test__/utils/issue-416-path-safety.test.ts --run
      - name: Typecheck
        run: pnpm typecheck
      - name: Server build
        run: pnpm server:build
      - name: Verify error-sink and FTPS invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          for f in ['postgres.ts','mysql.ts','mariadb.ts','mongo.ts','libsql.ts','compose.ts','web-server.ts']:
              s=Path('packages/server/src/utils/backups', f).read_text()
              assert 'getSafeRcloneErrorMessage(error)' in s, f
              assert 'throw new Error(safeErrorMessage);' in s, f
              assert 'errorMessage: error?.message' not in s, f
              assert '\t\tconsole.log(error);' not in s, f
          v=Path('packages/server/src/db/validations/destination.ts').read_text()
          assert '--ftp-no-check-certificate' in v
          assert '--no-check-certificate' in v
          assert 'hasDisabledFtpCertificateVerification' in v
          print('backup error and FTPS certificate security invariants verified')
          PY
      - name: Commit verified source and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/server/src/db/validations/destination.ts \
            packages/server/src/db/schema/destination.ts \
            packages/server/src/utils/backups/utils.ts \
            packages/server/src/utils/backups/redact.ts \
            packages/server/src/utils/backups/postgres.ts \
            packages/server/src/utils/backups/mysql.ts \
            packages/server/src/utils/backups/mariadb.ts \
            packages/server/src/utils/backups/mongo.ts \
            packages/server/src/utils/backups/libsql.ts \
            packages/server/src/utils/backups/compose.ts \
            packages/server/src/utils/backups/web-server.ts \
            apps/dokploy/__test__/backups/redact-credentials.test.ts \
            apps/dokploy/__test__/utils/backups.test.ts
          git commit -m "fix: harden backup credential error paths and FTPS verification"
          git push origin HEAD:feat/issue-416-backup-destinations

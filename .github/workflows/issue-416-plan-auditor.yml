name: Issue 416 Plan Auditor

on:
  push:
    branches:
      - feat/issue-416-backup-destinations
    paths:
      - .github/workflows/issue-416-plan-auditor.yml
      - .github/issue-416-plan-auditor.sh

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/issue-416-backup-destinations
      - uses: pnpm/action-setup@v5
        with:
          version: 10.22.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.4.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Plan Auditor validate, execute and full audit
        run: bash .github/issue-416-plan-auditor.sh
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-416-plan-auditor-evidence
          path: |
            .plan-auditor/plan.json
            .plan-auditor/evidence.jsonl
            /tmp/issue416-full-test.log
          if-no-files-found: warn

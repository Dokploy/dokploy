name: Pull Request

on:
  pull_request:
    branches: [main, canary]

permissions:
  contents: read

jobs:
  pr-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        job: [build, test, typecheck]
    services:
      postgres:
        image: ${{ matrix.job == 'test' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: dokploy
          POSTGRES_PASSWORD: dokploy
          POSTGRES_DB: deployment_lifecycle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dokploy -d deployment_lifecycle"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.4.0
          cache: "pnpm"
      
      - name: Install Nixpacks
        if: matrix.job == 'test'
        run:  |
          export NIXPACKS_VERSION=1.41.0
          curl -sSL https://nixpacks.com/install.sh | bash
          echo "Nixpacks installed $NIXPACKS_VERSION"

      - name: Install Railpack
        if: matrix.job == 'test'
        run:  |
          export RAILPACK_VERSION=0.15.4
          curl -sSL https://railpack.com/install.sh | bash
          echo "Railpack installed $RAILPACK_VERSION"
      
      - name: Add build tools to PATH
        if: matrix.job == 'test'
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Initialize Docker Swarm
        if: matrix.job == 'test'
        run: |
          docker swarm init
          docker network create --driver overlay dokploy-network || true
          echo "✅ Docker Swarm initialized"
      
      - run: pnpm install --frozen-lockfile
      - run: pnpm server:build
      - run: pnpm ${{ matrix.job }}
        env:
          TEST_DATABASE_URL: postgres://dokploy:dokploy@localhost:5432/deployment_lifecycle

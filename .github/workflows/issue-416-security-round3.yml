name: Issue 416 Security Round 3

on:
  push:
    branches:
      - feat/issue-416-backup-destinations
    paths:
      - .github/workflows/issue-416-security-round3.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/issue-416-backup-destinations
      - uses: pnpm/action-setup@v5
        with:
          version: 10.22.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.4.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply guarded edge-case fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          validation = Path("packages/server/src/db/validations/destination.ts")
          text = validation.read_text()
          old = '''const isBooleanFlagEnabled = (\n\tflags: readonly string[],\n\tflagName: string,\n): boolean =>\n\t(flags.includes(flagName) || flags.includes(`${flagName}=true`)) &&\n\t!flags.includes(`${flagName}=false`);\n\nexport const getFtpTlsState = (flags: readonly string[] | null | undefined) => {\n\tconst values = flags ?? [];\n\treturn {\n\t\timplicitTlsEnabled: isBooleanFlagEnabled(values, "--ftp-tls"),\n\t\texplicitTlsEnabled: isBooleanFlagEnabled(values, "--ftp-explicit-tls"),\n\t};\n};\n\nexport const hasDisabledFtpCertificateVerification = (\n\tflags: readonly string[] | null | undefined,\n): boolean => {\n\tconst values = flags ?? [];\n\treturn ["--ftp-no-check-certificate", "--no-check-certificate"].some(\n\t\t(flag) => values.includes(flag) || values.includes(`${flag}=true`),\n\t);\n};\n'''
          new = '''const parseBooleanFlagValue = (\n\tflag: string,\n\tflagName: string,\n): boolean | undefined => {\n\tif (flag === flagName) return true;\n\tconst prefix = `${flagName}=`;\n\tif (!flag.startsWith(prefix)) return undefined;\n\n\tconst value = flag.slice(prefix.length).toLowerCase();\n\tif (["1", "t", "true"].includes(value)) return true;\n\tif (["0", "f", "false"].includes(value)) return false;\n\treturn undefined;\n};\n\nconst getBooleanFlagValues = (flags: readonly string[], flagName: string) =>\n\tflags\n\t\t.filter((flag) => flag === flagName || flag.startsWith(`${flagName}=`))\n\t\t.map((flag) => parseBooleanFlagValue(flag, flagName));\n\nconst isBooleanFlagEnabled = (\n\tflags: readonly string[],\n\tflagName: string,\n): boolean => {\n\tconst values = getBooleanFlagValues(flags, flagName);\n\treturn values.length > 0 && values.every((value) => value === true);\n};\n\nexport const getFtpTlsState = (flags: readonly string[] | null | undefined) => {\n\tconst values = flags ?? [];\n\treturn {\n\t\timplicitTlsEnabled: isBooleanFlagEnabled(values, "--ftp-tls"),\n\t\texplicitTlsEnabled: isBooleanFlagEnabled(values, "--ftp-explicit-tls"),\n\t};\n};\n\nexport const hasDisabledFtpCertificateVerification = (\n\tflags: readonly string[] | null | undefined,\n): boolean => {\n\tconst values = flags ?? [];\n\treturn ["--ftp-no-check-certificate", "--no-check-certificate"].some(\n\t\t(flagName) => {\n\t\t\tconst matchingValues = getBooleanFlagValues(values, flagName);\n\t\t\treturn (\n\t\t\t\tmatchingValues.length > 0 &&\n\t\t\t\tmatchingValues.some((value) => value !== false)\n\t\t\t);\n\t\t},\n\t);\n};\n'''
          text = replace_once(text, old, new, "rclone boolean parser")
          validation.write_text(text)

          restore = Path("packages/server/src/utils/restore/web-server.ts")
          text = restore.read_text()
          text = replace_once(
              text,
              'import { getRclonePathAndFlags } from "../backups/utils";',
              'import { getSafeRcloneErrorMessage } from "../backups/redact";\nimport { getRclonePathAndFlags } from "../backups/utils";',
              "restore redaction import",
          )
          old_catch = '''\t} catch (error) {\n\t\tconsole.error(error);\n\t\temit(\n\t\t\t`Error: ${\n\t\t\t\terror instanceof Error\n\t\t\t\t\t? error.message\n\t\t\t\t\t: "Error restoring web server backup"\n\t\t\t}`,\n\t\t);\n\t\tthrow error;\n\t}\n'''
          new_catch = '''\t} catch (error) {\n\t\tconst safeErrorMessage = getSafeRcloneErrorMessage(error);\n\t\tconsole.error("Restore error:", safeErrorMessage);\n\t\temit(`Error: ${safeErrorMessage}`);\n\t\tthrow new Error(safeErrorMessage);\n\t}\n'''
          text = replace_once(text, old_catch, new_catch, "restore raw error sink")
          restore.write_text(text)

          test = Path("apps/dokploy/__test__/utils/backups.test.ts")
          text = test.read_text()
          old_reject = '''\ttest.each(["--ftp-no-check-certificate", "--no-check-certificate"])(\n\t\t"rejects certificate-verification bypass %s at schema validation",'''
          new_reject = '''\ttest.each([\n\t\t"--ftp-no-check-certificate",\n\t\t"--ftp-no-check-certificate=true",\n\t\t"--ftp-no-check-certificate=TRUE",\n\t\t"--ftp-no-check-certificate=1",\n\t\t"--ftp-no-check-certificate=t",\n\t\t"--no-check-certificate",\n\t\t"--no-check-certificate=true",\n\t\t"--no-check-certificate=TRUE",\n\t\t"--no-check-certificate=1",\n\t\t"--no-check-certificate=t",\n\t])(\n\t\t"rejects certificate-verification bypass %s at schema validation",'''
          text = replace_once(text, old_reject, new_reject, "schema bypass cases")

          old_runtime = '''\ttest.each(["--ftp-no-check-certificate", "--no-check-certificate"])(\n\t\t"rejects certificate-verification bypass %s at runtime",'''
          new_runtime = '''\ttest.each([\n\t\t"--ftp-no-check-certificate",\n\t\t"--ftp-no-check-certificate=TRUE",\n\t\t"--ftp-no-check-certificate=1",\n\t\t"--no-check-certificate",\n\t\t"--no-check-certificate=TRUE",\n\t\t"--no-check-certificate=1",\n\t])(\n\t\t"rejects certificate-verification bypass %s at runtime",'''
          text = replace_once(text, old_runtime, new_runtime, "runtime bypass cases")

          old_safe = '''\ttest.each([\n\t\t"--ftp-no-check-certificate=false",\n\t\t"--no-check-certificate=false",\n\t])("allows explicitly safe certificate flag %s", (flag) => {'''
          new_safe = '''\ttest.each([\n\t\t"--ftp-no-check-certificate=false",\n\t\t"--ftp-no-check-certificate=FALSE",\n\t\t"--ftp-no-check-certificate=0",\n\t\t"--ftp-no-check-certificate=f",\n\t\t"--no-check-certificate=false",\n\t\t"--no-check-certificate=FALSE",\n\t\t"--no-check-certificate=0",\n\t\t"--no-check-certificate=f",\n\t])("allows explicitly safe certificate flag %s", (flag) => {'''
          text = replace_once(text, old_safe, new_safe, "safe certificate cases")

          extra = '''\n\ttest.each([\n\t\t"--ftp-explicit-tls=TRUE",\n\t\t"--ftp-explicit-tls=1",\n\t\t"--ftp-explicit-tls=t",\n\t])("accepts pflag-compatible TLS true value %s", (flag) => {\n\t\texpect(\n\t\t\tapiCreateDestination.safeParse({\n\t\t\t\t...input,\n\t\t\t\tadditionalFlags: [flag],\n\t\t\t}).success,\n\t\t).toBe(true);\n\t});\n'''
          marker = '\n});'
          idx = text.rfind(marker)
          if idx == -1:
              raise SystemExit("FTP TLS test block end not found")
          if "accepts pflag-compatible TLS true value" not in text:
              text = text[:idx] + extra + text[idx:]
          test.write_text(text)
          PY
      - name: Format changed files
        run: |
          pnpm exec biome check --write \
            packages/server/src/db/validations/destination.ts \
            packages/server/src/utils/restore/web-server.ts \
            packages/server/src/utils/volume-backups/utils.ts \
            apps/dokploy/__test__/utils/backups.test.ts
      - name: Focused backup and security regressions
        run: |
          pnpm --filter=dokploy exec vitest --config __test__/vitest.config.ts \
            __test__/backups/redact-credentials.test.ts \
            __test__/utils/backups.test.ts \
            __test__/utils/issue-416-path-safety.test.ts --run
      - name: Typecheck
        run: pnpm typecheck
      - name: Server build
        run: pnpm server:build
      - name: Verify hardened invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          v = Path("packages/server/src/db/validations/destination.ts").read_text()
          assert 'parseBooleanFlagValue' in v
          assert '["1", "t", "true"]' in v
          assert 'value !== false' in v
          r = Path("packages/server/src/utils/restore/web-server.ts").read_text()
          assert 'getSafeRcloneErrorMessage(error)' in r
          assert 'console.error(error)' not in r
          assert 'throw new Error(safeErrorMessage)' in r
          vol = Path("packages/server/src/utils/volume-backups/utils.ts").read_text()
          assert 'errorMessage: safeErrorMessage' in vol
          assert 'getSafeRcloneErrorMessage(error)' in vol
          print("round-3 security invariants verified")
          PY
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/server/src/db/validations/destination.ts \
            packages/server/src/utils/restore/web-server.ts \
            packages/server/src/utils/volume-backups/utils.ts \
            apps/dokploy/__test__/utils/backups.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix: close remaining backup credential and FTPS bypasses"
            git push origin HEAD:feat/issue-416-backup-destinations
          fi

name: Cleanup Dokploy 416 carrier transports
on:
  push:
    branches:
      - canary
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canary
          fetch-depth: 0
      - name: Remove temporary transport workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-dokploy-5491.yml .github/workflows/repair-dokploy-416.yml
          git commit -m "chore: remove temporary Dokploy 416 transports"
          git push origin HEAD:canary

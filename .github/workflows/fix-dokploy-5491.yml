name: Fix Dokploy 5491 carrier
on:
  pull_request:
    branches:
      - canary
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canary
          fetch-depth: 0
      - name: Apply carrier cleanup and remove transports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("apps/dokploy/components/dashboard/settings/destination/handle-destinations.tsx")
          s = p.read_text()

          option = re.compile(
              r'\n\s*<SelectItem value=\{RCLONE_CONFIG_PROVIDER\}>\s*'
              r'Generic rclone config\s*</SelectItem>'
          )
          s, option_count = option.subn("", s, count=1)
          if option_count != 1:
              raise SystemExit("expected exactly one duplicate Generic rclone option")

          guidance = re.compile(
              r'\n\s*\{isGenericRclone && \(\s*'
              r'<p className="text-xs text-muted-foreground">\s*'
              r'Provision this config file and named remote at the same path on every host that executes backups or restores\. '
              r'Self-hosted connection tests run on the Dokploy host; cloud or remote resources use the selected resource server\.\s*'
              r'</p>\s*\)\}'
          )
          s, guidance_count = guidance.subn("", s, count=1)
          if guidance_count != 1:
              raise SystemExit("expected exactly one duplicated execution-host guidance block")

          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-dokploy-5491.yml .github/workflows/repair-dokploy-416.yml
          git add -A apps/dokploy/components/dashboard/settings/destination/handle-destinations.tsx .github/workflows
          git commit -m "fix(backups): dedupe generic rclone destination UI"
          git push origin HEAD:canary
